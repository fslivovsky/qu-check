name = "qlrup-checker"
version = "0.1.0"
defaultTargets = ["QlrupChecker", "qlrup-check"]

[leanOptions]
relaxedAutoImplicit = false

# QBF semantics and the soundness of universal reduction (a git submodule).
[[require]]
name = "qbf-lean"
path = "formalization"

[[lean_lib]]
name = "QlrupChecker"
precompileModules = true

[[lean_exe]]
name = "qlrup-check"
root = "Main"
