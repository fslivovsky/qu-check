name = "qlrup-checker"
version = "0.1.0"
defaultTargets = ["QlrupChecker", "qlrup-check"]

[leanOptions]
relaxedAutoImplicit = false

# QBF syntax, semantics and the soundness of universal reduction.
[[lean_lib]]
name = "QbfLean"
precompileModules = true

[[lean_lib]]
name = "QlrupChecker"
precompileModules = true

[[lean_exe]]
name = "qlrup-check"
root = "Main"
